<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onyi's Jokes</title>

    <script src="index.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

</head>
<body class="bg-[#0b2a4a] font-[EB Garamond] text-white h-screen 
flex flex-col overflow-hidden bg-[url('Assignment8-bg-images/emoji-background-image-mobile.png')]
bg-cover bg-center bg-no-repeat sm:bg-[url('Assignment8-bg-images/emoji-background-image-desktop.png')]">

    <header class="bg-[#0d2f55]/90 flex items-center justify-center px-4 py-4 sm:flex items-center sm:justify-between sm:px-8 py-6">
        <div class="flex items-center gap-2 sm:gap-4">
            <span class="text-3xl">😂</span>
            <h1 class="text-lg font-semibold">Laugh out Loud</h1>
        </div>

        <p class="hidden sm:block text-lg font-semibold">Good jokes. Brighter days</p>
    </header>

    <main class="flex flex-1 items-center justify-center px-5 py-8">
        <section class="w-full max-w-md rounded-[28px] border border-white/30 bg-[#0b2a4a]/75 p-5 text-center backdrop-blur-md shadow-2xl sm:p-10 sm:max-w-3xl">
            
            <p class="mb-4 text-[10px] uppercase text-blue-200 sm:tracking-[0.1rem] ">A little laughter goes a long way</p>

            <h2 class="mb-6 font-serif text-[40px] sm:text-[52px]">Onyi's Jokes</h2>

            <div class="mb-6 rounded-3xl bg-white/10 p-6 border border-white/50 sm:p-8 sm:mb-12">
                <p id="joke-text" class="text-[18px] sm:text-[24px]"></p>
            </div>

            <div class="flex flex-col gap-4 sm:flex sm:flex-row sm:gap-4 sm:justify-center">
                <button id="new-joke-btn" class="bg-white/10 rounded-full border border-white/20 py-2 font-semibold text-[16px] transition hover:bg-yellow-300 hover:text-black hover:shadow-[0_0_25px_rgba(250,204,21,0.55)] disabled:opacity-50 disabled:cursor-not-allowed sm:flex-1">New Joke</button>

                <button id="copy-btn" class="bg-white/10 rounded-full border border-white/20 py-2 font-semibold text-[16px] transition hover:bg-blue-300/50 sm:flex-1">Copy</button>
            </div>

            <div class="mt-8 flex items-center justify-center gap-3 sm:gap-4">
                <div class="h-px w-10 bg-white/50 sm:w-38"></div>

                <p class="whitespace-nowrap text-xs text-blue-100 leading-none sm:text-sm">Made with 🩷 by Gift Godwin</p>

                <div class="h-px w-10 bg-white/50 sm:w-38"></div>
            </div>

        </section>
    </main>

</body>
</html>
